name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-exclusive-move:
    name: Native exclusive move (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Run native exclusive-move tests
        run: uv run --python 3.12 pytest -v tests/unit/test_exclusive_move.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  # The locked LanceDB (0.30.x) accepts double-quoted SQL literals through a
  # legacy fallback; newer releases inside the pin reject them. Run the
  # filter-dependent tests against the newest allowed release too.
  test-lancedb-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies with newest allowed LanceDB
        run: |
          uv sync --frozen
          uv pip install --upgrade "lancedb<0.40"
          uv run python -c "import lancedb; print('lancedb', lancedb.__version__)"

      - name: Run filter-dependent tests
        run: >
          uv run --no-sync pytest -v
          tests/unit/test_filters.py
          tests/integration/test_hostile_filenames.py
          tests/integration/test_indexer.py
          tests/integration/test_list_notes_filter.py
          tests/integration/test_search_correctness.py

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify package builds
        run: uv build

      - name: Check version not already on PyPI
        if: github.event_name == 'pull_request'
        run: |
          PKG_NAME="$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r\"^name\s*=\s*\\\"([^\\\"]+)\\\"\", text, re.MULTILINE)
          print(m.group(1))
          ")"
          PKG_VERSION="$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r\"^version\s*=\s*\\\"([^\\\"]+)\\\"\", text, re.MULTILINE)
          print(m.group(1))
          ")"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "::error::Version ${PKG_VERSION} already exists on PyPI. Bump it."
            exit 1
          fi
          echo "Version ${PKG_VERSION} is available."
